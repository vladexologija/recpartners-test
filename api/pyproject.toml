[project]
name = "hotdog-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vlad Rill", email = "vladimir.glusac.rill@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncer>=0.0.18",
    "fastapi[standard]>=0.141.1",
    "google-auth>=2.58.1",
    "google-cloud-pubsub>=2.41.0",
    "google-cloud-storage>=3.15.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["app", "tests"]
strict_equality = true  # catches status typos such as == "procesing"

[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
